<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор кандидатов</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <section class="profile-card">
            <!-- Левая часть: Форма -->
            <div class="form-column">
                <form class="user-form">
                    <div class="form-group">
                        <label for="name">Имя и Фамилия</label>
                        <input id="name" type="text" readonly placeholder="Загрузка...">
                    </div>
                    <div class="form-group">
                        <label for="gender">Пол</label>
                        <input id="gender" type="text" readonly placeholder="Загрузка...">
                    </div>
                    <div class="form-group">
                        <label for="email">Электронная почта</label>
                        <input id="email" type="email" readonly placeholder="Загрузка...">
                    </div>
                    <div class="form-group">
                        <label for="birthday">День рождения</label>
                        <input id="birthday" type="text" readonly placeholder="Загрузка...">
                    </div>
                    <div class="form-group">
                        <label for="address">Адрес проживания</label>
                        <input id="address" type="text" readonly placeholder="Загрузка...">
                    </div>
                    <div class="form-group">
                        <label for="phone">Номер телефона</label>
                        <input id="phone" type="tel" readonly placeholder="Загрузка...">
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input id="password" type="password" readonly placeholder="Загрузка...">
                    </div>
                </form>
            </div>

            <!-- Правая часть: Аватар -->
            <div class="avatar-column">
                <h2>Аватар кандидата</h2>
                <img id="img" class="avatar" src="https://via.placeholder.com/250" alt="Фотография кандидата">
            </div>
        </section>

        <!-- Кнопка -->
        <div class="button-wrapper">
            <button id="fetchUser" class="button_new">Найти нового!</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
